apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
  labels:
    app: aceest-fitness-canary
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-fitness-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness-canary
        track: stable
    spec:
      containers:
        - name: aceest-fitness
          image: 2026ht66012/aceest-fitness:v4.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
  labels:
    app: aceest-fitness-canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness-canary
        track: canary
    spec:
      containers:
        - name: aceest-fitness
          image: 2026ht66012/aceest-fitness:v4.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-svc
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness-canary
  ports:
    - port: 80
      targetPort: 5000
