apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
  labels:
    app: aceest-fitness-bg
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-bg
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-fitness-bg
        slot: blue
    spec:
      containers:
        - name: aceest-fitness
          image: 2026ht66012/aceest-fitness:v4.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
  labels:
    app: aceest-fitness-bg
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-bg
      slot: green
  template:
    metadata:
      labels:
        app: aceest-fitness-bg
        slot: green
    spec:
      containers:
        - name: aceest-fitness
          image: 2026ht66012/aceest-fitness:v4.1.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-bg-svc
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness-bg
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
